name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm test

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure C17 core with Clang sanitizers and libFuzzer
        run: >-
          cmake -S native -B native/.build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DENFUSION_BUILD_FUZZER=ON

      - run: cmake --build native/.build-sanitize --parallel
      - run: ctest --test-dir native/.build-sanitize --output-on-failure
      - name: Build owned fuzz seed corpus
        run: |
          mkdir -p native/.build-sanitize/fuzz-corpus
          native/.build-sanitize/edds-fixture \
            native/.build-sanitize/fuzz-corpus/copy \
            native/.build-sanitize/fuzz-corpus/lz4 \
            native/.build-sanitize/fuzz-corpus/dxt1 \
            native/.build-sanitize/fuzz-corpus/odd-fourcc \
            native/.build-sanitize/fuzz-corpus/integer-overflow \
            native/.build-sanitize/fuzz-corpus/source.png \
            native/.build-sanitize/fuzz-corpus/source.tga \
            native/.build-sanitize/fuzz-corpus/source.jpg \
            native/.build-sanitize/fuzz-corpus/source.tiff \
            native/.build-sanitize/fuzz-corpus/source-gpu.tga \
            native/.build-sanitize/fuzz-corpus/source-gpu-flat.tga \
            native/.build-sanitize/fuzz-corpus/source.dds
          cp native/.build-sanitize/black-box-png-result.edds.meta \
            native/.build-sanitize/fuzz-corpus/metadata
          # Every runtime format the black box produced, so the block decoders start from real ones.
          for produced in native/.build-sanitize/black-box-gpu-*.edds; do
            cp "$produced" "native/.build-sanitize/fuzz-corpus/$(basename "$produced")"
          done
          printf '%s' '{"protocolVersion":1,"kind":"batch","jobCount":100}' \
            > native/.build-sanitize/fuzz-corpus/batch-header
          printf '%s' '{"protocolVersion":2,"kind":"batch","jobCount":1}' \
            > native/.build-sanitize/fuzz-corpus/batch-incompatible
          printf '%s' '{"protocolVersion":1,"kind":"surprise"}' \
            > native/.build-sanitize/fuzz-corpus/batch-unknown
          printf '%s\n%s\n' '{"protocolVersion":1,"kind":"batch","jobCount":2}' \
            '{"protocolVersion":1,"kind":"end"}' \
            > native/.build-sanitize/fuzz-corpus/batch-stream
          { head -c 300000 /dev/zero | tr '\0' 'x'; printf '\n{}\n'; } \
            > native/.build-sanitize/fuzz-corpus/batch-oversized-line
      - name: Fuzz EDDS, images, metadata, and batch NDJSON smoke
        # Include all BC6H modes and both RGBE encodings in the existing sanitizer campaign.
        run: |
          python3 native/tests/edds/hdr_fixtures.py native/.build-sanitize/enfusion native/.build-sanitize/fuzz-corpus
          native/.build-sanitize/edds-fuzz -runs=2000 native/.build-sanitize/fuzz-corpus
      - name: Build owned font fuzz seed corpus
        run: |
          mkdir -p native/.build-sanitize/font-corpus
          native/.build-sanitize/enfusion-font-fixture native/.build-sanitize/font-corpus
          # The font and recipe the black box generated, so the FNT and recipe readers start from real ones.
          cp native/.build-sanitize/font-black-box/out/SDF_FixtureSans32.fnt \
            native/.build-sanitize/font-black-box/out/SDF_FixtureSans32.fnt.meta \
            native/.build-sanitize/font-corpus/
      - name: Fuzz TrueType fonts, character sets, recipes and FNT smoke
        run: native/.build-sanitize/font-fuzz -runs=2000 native/.build-sanitize/font-corpus

  windows-x64-package:
    needs: [extension, native-sanitizers]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure the native executable
        run: cmake -S native -B native/.build -A x64 -DCMAKE_INSTALL_PREFIX=dist/native/win32-x64

      - name: Build the native executable
        run: cmake --build native/.build --config Release --parallel

      - name: Test native core and black-box CLI
        run: ctest --test-dir native/.build -C Release --output-on-failure

      - name: Test extension recovery against native process crashes
        run: npm test
        env:
          EDDS_TEST_CONVERTER: native/.build/Release/enfusion.exe

      - name: Stage the tested executable and notices
        run: cmake --install native/.build --config Release

      - name: Verify x64 image and static MSVC runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $tools = Get-ChildItem -LiteralPath "$installation\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tools.FullName 'bin\Hostx64\x64\dumpbin.exe'
          $binary = 'dist\native\win32-x64\enfusion.exe'
          $headers = & $dumpbin /headers $binary | Out-String
          if ($headers -notmatch '8664 machine \(x64\)') { throw 'enfusion.exe is not a Windows x64 image' }
          $dependencies = & $dumpbin /dependents $binary | Out-String
          if ($dependencies -match '(?i)(VCRUNTIME|MSVCP|ucrtbase)') { throw "dynamic MSVC runtime dependency found: $dependencies" }

      - run: npm run package

      - name: Package allowlist and binary-identity smoke
        shell: pwsh
        run: ./scripts/package-smoke.ps1 -Vsix enfusion-plugin-win32-x64.vsix

      - name: Clean-install and activation smoke
        run: npm run test:installed

      - uses: actions/upload-artifact@v4
        with:
          name: enfusion-plugin-win32-x64-vsix
          path: enfusion-plugin-win32-x64.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: enfusion-native-win32-x64
          path: |
            dist/native/win32-x64/enfusion.exe
            dist/native/win32-x64/NOTICE.txt
            dist/native/win32-x64/THIRD-PARTY.md
          if-no-files-found: error
