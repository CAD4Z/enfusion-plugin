<!-- The Enfusion mark, from the engine's own favicon at https://enfusionengine.com/favicon.svg —
     the same symbol that stands in front of the word in the ENFUSION wordmark. Unchanged apart
     from the frame: the favicon letterboxes the art inside a 160x160 square, and the viewBox here
     is cropped to the art itself so the activity bar renders it as large as it can.
     The brand blue is gone for the same reason `currentColor` is here: the bar uses the file as a
     mask, so the theme decides the colour and only the silhouette survives. See THIRD-PARTY.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 141 79.5906" fill="currentColor">
  <title>Enfusion</title>
  <path d="M44.2037 54.9306V10.9283H0L44.2037 54.9306Z"/>
  <path d="M71.9512 10.9283L141 79.5906V10.9283H71.9512Z"/>
  <path d="M51.1937 55.0017H106.034L51.1937 0V55.0017Z"/>
</svg>
